version: 2

models:
  - name: dim_customers
    description: "One row per unique customer. Answers: where are our customers, and who are repeat buyers?"

    config:
      contract: 
        enforced: true
    columns:
      - name: customer_unique_id
        data_type: string
        description: "Unique customer identifier (grain of this table)."
        data_tests:
          - unique
          - not_null
      - name: customer_city
        data_type: string
        description: "Customer city."
      - name: customer_state
        data_type: string
        description: "Customer state."
      - name: first_order_at
        data_type: Timestamp
        description: "Timestamp of the customer's first order."
      - name: last_order_at
        data_type: Timestamp
        description: "Timestamp of the customer's most recent order."
      - name: total_orders
        data_type: int64
        description: "Total number of orders placed by the customer."
      - name: lifetime_value
        data_type: float64
        description: "Total amount the customer has spent."

  - name: dim_products
    description: "One row per product, with category and physical attributes."
    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Product category."

  - name: dim_sellers
    description: "One row per seller, with location."
    columns:
      - name: seller_id
        description: "Unique seller identifier."
        data_tests:
          - unique
          - not_null
      - name: seller_city
        description: "Seller city."
      - name: seller_state
        description: "Seller state."

  - name: fct_orders
    description: "One row per order. Status, timestamps, and order-level metrics."
    columns:
      - name: order_id
        description: "Unique order identifier (grain of this table)."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer key for this order."
        data_tests:
          - not_null
      - name: order_status
        description: "Current order status."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "delivered",
                    "shipped",
                    "canceled",
                    "unavailable",
                    "invoiced",
                    "processing",
                    "created",
                    "approved",
                  ]

  - name: fct_order_items
    description: "One row per item within an order. Price, freight, and keys to product and seller."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_key]
    columns:
      - name: order_id
        description: "Order this item belongs to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_key
        description: "Item sequence number within the order."
        data_tests:
          - not_null
      - name: product_id
        description: "Product key."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: "Seller key."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: price
        description: "Item price."
      - name: freight_value
        description: "Freight cost for the item."
