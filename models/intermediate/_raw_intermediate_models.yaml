version: 2

models:
  - name: int_orders_enriched
    description: "Orders enriched with customer and related details. One row per order."
    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier for the order."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_olist_customers')
              field: customer_id

  - name: int_order_items_enriched
    description: "Order items enriched with product and seller details. One row per item within an order."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_number
    columns:
      - name: order_id
        description: "Order identifier."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_olist_orders')
              field: order_id
      - name: order_item_number
        description: "Sequential item number within an order."
        data_tests:
          - not_null
      - name: product_id
        description: "Product identifier."
        data_tests:
          - not_null
      - name: seller_id
        description: "Seller identifier."
        data_tests:
          - not_null

  - name: int_order_payments_agg
    description: "Payments aggregated to the order level. One row per order."
    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_olist_orders')
              field: order_id

  - name: int_order_reviews_agg
    description: "Reviews aggregated to the order level. One row per order."
    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_olist_orders')
              field: order_id